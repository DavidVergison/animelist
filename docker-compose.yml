services:
  suivi-anime:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD est requis}
      DB_PATH: /data/suivi-anime.db
      SESSION_SECRET: ${SESSION_SECRET:-}
      BEHIND_HTTPS: ${BEHIND_HTTPS:-false}
    volumes:
      - anime-data:/data
    restart: unless-stopped
volumes:
  anime-data:
